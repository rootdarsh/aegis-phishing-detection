<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f9fafb;
      color: #111827;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .logo-icon {
      font-size: 24px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      color: #1e3a8a;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .current-url-box {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      word-break: break-all;
      margin-bottom: 12px;
      max-height: 50px;
      overflow-y: auto;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .result-card {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      display: none;
      font-size: 12px;
    }
    .result-safe {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }
    .result-suspicious {
      background: #fef9c3;
      color: #a16207;
      border: 1px solid #fde047;
    }
    .result-dangerous {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }
    .dashboard-link {
      display: block;
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .dashboard-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">🛡️</div>
    <div>
      <h2>AEGIS Phishing Shield</h2>
      <div style="font-size: 10px; color: #6b7280;">Real-Time ML Threat Assessment</div>
    </div>
  </div>

  <div class="status-bar">
    <span>Backend:</span>
    <span id="backend-status">Checking...</span>
  </div>

  <div style="font-size: 11px; font-weight: 600; margin-bottom: 4px; color: #4b5563;">Active Webpage:</div>
  <div class="current-url-box" id="active-url">Detecting active tab...</div>

  <button class="btn" id="btn-scan">🔍 Scan Page Security</button>

  <div id="result-box" class="result-card">
    <div id="result-verdict" style="font-weight: 700; margin-bottom: 4px;"></div>
    <div id="result-score" style="margin-bottom: 6px;"></div>
    <div id="result-reasons" style="font-size: 11px;"></div>
  </div>

  <a href="http://localhost:8501" target="_blank" class="dashboard-link">📊 Open AEGIS Live Telemetry Dashboard →</a>

  <script src="popup.js"></script>
</body>
</html>
